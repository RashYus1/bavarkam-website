{{ define "main" }}
<div class="container">
  <h1>{{ .Title }}</h1>
  <p class="product-description">{{ .Description }}</p>
  
  <!-- Video Section - This will appear right after title and before content -->
  <div class="video-container">
    <h2>Product Video</h2>
    <video id="productVideo" class="product-video" controls preload="metadata">
      <source src="/videos/cad-cam.mp4" type="video/mp4">
      Your browser does not support the video tag. Please download the video to watch it.
    </video>
    
    <!-- Video Controls with Audio Option -->
    <div class="video-controls">
      <button onclick="togglePlay()" class="video-btn">▶ Play/Pause</button>
      <button onclick="toggleMute()" class="video-btn">🔊 Mute/Unmute</button>
      <span class="volume-indicator">Volume: <span id="volumeLevel">100%</span></span>
    </div>
    
    <!-- Video Description -->
    <p class="video-description">
      Watch our CAD/CAM technology in action - precision dental solutions by Face Dent
    </p>
  </div>
  
  <!-- Image Gallery Section -->
  <div class="product-gallery">
    <h2>Product Gallery</h2>
    <div class="gallery-grid">
      {{ range .Params.images }}
      <div class="gallery-item">
        <img src="{{ . }}" alt="{{ $.Title }}" onclick="openModal(this.src)">
      </div>
      {{ end }}
    </div>
  </div>
  
  <!-- Product Content -->
  <div class="product-content">
    {{ .Content }}
  </div>
</div>

<!-- Modal for image zoom -->
<div id="imageModal" class="modal" onclick="closeModal()">
  <span class="close">&times;</span>
  <img class="modal-content" id="modalImage">
</div>

<style>
.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
   color: white;  /* 👈 ADD THIS - makes all text white */
}

h1 {
   color: white;  /* 👈 CHANGE FROM #333 to white */
  border-bottom: 2px solid #0066cc;
  padding-bottom: 10px;
   text-align: center;  /* 👈 ADD THIS - centers the title */
}

.product-description {
  font-size: 1.1rem;
  color: white;  /* 👈 CHANGE FROM #666 to white */
  margin-bottom: 30px;
  text-align: center;  /* 👈 ADD THIS - centers the description */
}

/* Video Section Styles */
.video-container {
  margin: 40px 0;
  padding: 20px;
  background: #f8f9fa;
  border-radius: 15px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

.video-container h2 {
  color: #0066cc;
  margin-bottom: 20px;
}

.product-video {
  width: 100%;
  max-width: 800px;
  height: auto;
  display: block;
  margin: 0 auto;
  border-radius: 10px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.2);
}

.video-controls {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin: 15px 0;
  flex-wrap: wrap;
}

.video-btn {
  background: #0066cc;
  color: rgb(243, 243, 244);
  border: none;
  padding: 10px 20px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 1rem;
  transition: background 0.3s;
}

.video-btn:hover {
  background: #004999;
}



.volume-indicator {
  display: inline-block;
  padding: 10px 20px;
  background: #0066cc;  /* 👈 CHANGE to blue background */
  color: white;  /* 👈 ADD this - white text */
  border-radius: 5px;
  font-weight: bold;
  border: none;
}


.video-description {
  text-align: center;
  color: #666;
  font-style: italic;
  margin-top: 10px;
}

/* Gallery Styles */
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
  margin: 30px 0;
}

.gallery-item img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  border-radius: 10px;
  cursor: pointer;
  transition: transform 0.3s, box-shadow 0.3s;
  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

.gallery-item img:hover {
  transform: scale(1.05);
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

.product-content {
  margin-top: 40px;
  line-height: 1.8;
  color: #444;
}

.product-content h2 {
  color: #0066cc;
  margin: 30px 0 15px;
}

.product-content ul, .product-content ol {
  margin-left: 20px;
}

/* Modal styles */
.modal {
  display: none;
  position: fixed;
  z-index: 1000;
  padding-top: 50px;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0,0,0,0.9);
  overflow: auto;
}

.modal-content {
  margin: auto;
  display: block;
  max-width: 90%;
  max-height: 90%;
  border-radius: 10px;
}

.close {
  position: absolute;
  top: 15px;
  right: 35px;
  color: #f1f1f1;
  font-size: 40px;
  font-weight: bold;
  cursor: pointer;
  transition: color 0.3s;
}

.close:hover {
  color: #bbb;
}

/* Responsive Design */
@media (max-width: 768px) {
  .video-controls {
    flex-direction: column;
    align-items: center;
  }
  
  .video-btn {
    width: 80%;
  }
  
  .gallery-grid {
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  }
  
  .gallery-item img {
    height: 150px;
  }
}

/* Fix for product content text */
.product-content {
  color: white;
}

.product-content h2 {
  color: white;  /* 👈 Features, Applications titles */
  border-bottom: 1px solid #0066cc;
  padding-bottom: 5px;
}

.product-content h3 {
  color: white;
}

.product-content p {
  color: white;
}

.product-content ul, 
.product-content ol {
  color: white;
}

.product-content li {
  color: white;
  margin-bottom: 5px;
}

/* Fix for the last line */
.product-content p:last-of-type {
  color: white;
  font-style: italic;
  margin-top: 20px;
}

</style>

<script>
// Get the video element
const video = document.getElementById('productVideo');

// Play/Pause function
function togglePlay() {
  if (video.paused) {
    video.play();
  } else {
    video.pause();
  }
}

// Mute/Unmute function
function toggleMute() {
  video.muted = !video.muted;
  updateVolumeIndicator();
}

// Update volume indicator
function updateVolumeIndicator() {
  const volumeLevel = document.getElementById('volumeLevel');
  if (video.muted) {
    volumeLevel.textContent = 'Muted';
  } else {
    volumeLevel.textContent = Math.round(video.volume * 100) + '%';
  }
}

// Update volume display when volume changes
video.addEventListener('volumechange', updateVolumeIndicator);

// Optional: Auto-play settings
video.addEventListener('loadedmetadata', function() {
  console.log('Video loaded successfully');
});

// Error handling
video.addEventListener('error', function(e) {
  console.error('Video error:', e);
  alert('There was an error loading the video. Please check that the video file exists.');
});

// Image modal functions
function openModal(src) {
  document.getElementById('imageModal').style.display = 'block';
  document.getElementById('modalImage').src = src;
}

function closeModal() {
  document.getElementById('imageModal').style.display = 'none';
  // Pause video when closing modal
  video.pause();
}

// Close modal with ESC key
document.addEventListener('keydown', function(e) {
  if(e.key === 'Escape') {
    closeModal();
  }
});

// Initialize volume indicator on page load
document.addEventListener('DOMContentLoaded', updateVolumeIndicator);
</script>
{{ end }}
