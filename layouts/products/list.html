{{ define "main" }}
<div class="container" style="max-width: 1200px; margin: 0 auto; padding: 20px;">
  <h1 style="text-align: center; color: white; font-size: 42px; margin-top: 60px; margin-bottom: 40px;">{{ .Title }}</h1>
  
  <div class="product-grid-3d" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; margin: 40px auto;">
    {{ range .Pages }}
    <div class="product-card-3d" style="background: rgba(255,255,255,0.95); border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.2); transition: transform 0.3s; text-align: center; transform-style: preserve-3d;">
      <a href="{{ .RelPermalink }}" style="text-decoration: none; color: inherit;">
        {{ $image := .Params.image }}
        {{ if $image }}
        <img src="{{ $image }}" alt="{{ .Title }}" style="width: 100%; height: 250px; object-fit: cover; transition: transform 0.4s;">
        {{ else }}
        <img src="/images/placeholder.png" alt="{{ .Title }}" style="width: 100%; height: 250px; object-fit: cover;">
        {{ end }}
        <h3 style="padding: 20px 15px 5px; font-size: 22px; color: #333;">{{ .Title }}</h3>
        <p style="padding: 0 15px 20px; color: #666;">{{ .Description }}</p>
      </a>
    </div>
    {{ end }}
  </div>
</div>

<style>
.product-card-3d:hover img {
  transform: scale(1.1);
}
.product-card-3d:hover {
  transform: translateY(-10px);
  box-shadow: 0 20px 40px rgba(0,0,0,0.3);
}
</style>
{{ end }}
